[package]
name = "overhead-render"
version = "0.1.0"
edition = "2024"

[features]
# Explicitly enabled only by a separate measurement harness; not a UI setting.
measurement = []
# Accepted host trial exposed only to the isolated target feasibility image.
representation-measurement = ["measurement"]

[dependencies]
embedded-graphics.workspace = true
libm = "0.2"
overhead-core = { version = "0.1.0", path = "../core" }
overhead-app = { path = "../app" }

[dev-dependencies]
serde_json = "1"
