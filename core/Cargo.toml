[package]
name = "overhead-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# SGP4 propagation and element-set handling; no_std with libm float math.
# See docs/decisions/0006-sgp4-crate-and-conventions.md.
sgp4 = { version = "2.4", default-features = false, features = ["libm"] }
# no_std coordinate math; already a transitive dependency of sgp4.
libm = "0.2"
# Checked OMM metadata adapter; already transitive through sgp4/serde.
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }

[features]
# OMM (JSON) parsing with checked metadata; requires an allocator.
# Off by default so the bare no_std build stays allocation-free.
omm = ["sgp4/serde", "dep:serde"]
# Checked catalogue merge and diagnostics; no_std + alloc, no file I/O.
catalogue = ["omm"]

[dev-dependencies]
# Tests parse the checked-in OMM fixture; enabling sgp4's serde feature here
# leaks into test builds only (cargo feature unification). Note sgp4 forbids
# combining its std and libm features, so tests stay on libm + serde (alloc).
sgp4 = { version = "2.4", default-features = false, features = ["libm", "serde"] }
serde_json = "1"
