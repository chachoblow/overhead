[package]
name = "overhead-s3-benchmark"
version = "0.1.0"
edition = "2024"

[features]
# Shared host/target reference checker only; no capture harness or new dependency.
numerical-reference = []
catalogue-memory = ["overhead-core/catalogue", "dep:serde_json", "dep:esp-alloc"]
# Separate opt-in renderer experiment; never part of frozen M2 images.
coast-measurement = ["dep:overhead-app", "dep:overhead-render", "dep:embedded-graphics", "dep:serde_json", "dep:esp-alloc", "overhead-core/catalogue", "overhead-render/measurement"]
coast-measurement-on = ["coast-measurement"]
# Separate candidate image; historical Stage A and frozen M2 features unchanged.
coast-representation = ["coast-measurement", "overhead-render/representation-measurement"]
coast-representation-on = ["coast-representation"]
# Prepared/cached layer image (0058/0059); keeps the candidate for exactness checks.
coast-prepared = ["coast-representation"]
# Isolated Sharp 400x240 wiring/refresh test; no radar, allocator or network.
sharp-test = []
# First fixed-fixture radar on the panel. Reuses the already tested target
# fixture/framebuffer/renderer path; distinct from the historical images.
sharp-radar = ["sharp-test", "coast-prepared"]
# Separate deterministic short-loop radar replay; does not replace the static image.
sharp-replay = ["sharp-radar"]
# Separate display-cost diagnostic; shares the accepted replay, never frozen images.
sharp-profile = ["sharp-replay"]
# Opt-in period-cache comparison, separate from the visually accepted v3 image.
sharp-cache = ["sharp-replay"]
# Separate selective-line transport diagnostic; not the accepted cache image.
sharp-lines = ["sharp-replay"]

[dependencies]
overhead-core = { path = "../core" }
# Existing shared crates; optional so historical kernel builds remain unchanged.
overhead-app = { path = "../app", optional = true }
overhead-render = { path = "../render", optional = true }
embedded-graphics = { version = "0.8", optional = true }
# Same checked OMM-array path as the host experiment, without std.
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"], optional = true }

[target.'cfg(target_arch = "xtensa")'.dependencies]
# S3 startup, clock, and monotonic timer; no RTOS or wireless stack.
esp-hal = { version = "=1.2.2", features = ["esp32s3"] }
# UART0 diagnostics through the board's CP2102N bridge.
esp-println = { version = "=0.18.0", default-features = false, features = ["esp32s3", "uart", "critical-section"] }
# ESP-IDF-format image descriptor required by the flasher/bootloader.
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
# Bounded internal-RAM experiment; no C allocator exports or implicit global heap.
esp-alloc = { version = "=0.11.0", default-features = false, features = ["esp32s3"], optional = true }

[build-dependencies]
# Convert original fixtures on the host; the default target remains allocation-free.
sgp4 = { version = "=2.4.0", default-features = false, features = ["libm", "serde"] }
serde_json = "1"

[[bin]]
name = "overhead-s3-benchmark"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "overhead-s3-catalogue-memory"
path = "src/catalogue_main.rs"
required-features = ["catalogue-memory"]
test = false
bench = false

[[bin]]
name = "overhead-s3-coast-measurement"
path = "src/coast_main.rs"
required-features = ["coast-measurement"]
test = false
bench = false

[[bin]]
name = "overhead-s3-coast-representation"
path = "src/representation_main.rs"
required-features = ["coast-representation"]
test = false
bench = false

[[bin]]
name = "overhead-s3-coast-prepared"
path = "src/prepared_main.rs"
required-features = ["coast-prepared"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-test"
path = "src/sharp_main.rs"
required-features = ["sharp-test"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-radar"
path = "src/sharp_radar_main.rs"
required-features = ["sharp-radar"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-replay"
path = "src/sharp_replay_main.rs"
required-features = ["sharp-replay"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-profile"
path = "src/sharp_profile_main.rs"
required-features = ["sharp-profile"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-cache"
path = "src/sharp_cache_main.rs"
required-features = ["sharp-cache"]
test = false
bench = false

[[bin]]
name = "overhead-s3-sharp-lines"
path = "src/sharp_lines_main.rs"
required-features = ["sharp-lines"]
test = false
bench = false

[[example]]
name = "prepared_expected"
required-features = ["coast-prepared"]

[[example]]
name = "representation_expected"
required-features = ["coast-representation-on"]

[[example]]
name = "numerical_expected"
required-features = ["numerical-reference"]

[[example]]
name = "catalogue_expected"
required-features = ["catalogue-memory"]

[profile.release]
opt-level = 3
debug = 2

# Separate from the host workspace and its feature unification/toolchain.
[workspace]
resolver = "3"
