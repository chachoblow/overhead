[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# GNU ld resolves INCLUDE "rodata.x" from this working directory before -L
# paths: our pinned remedy overrides HAL's copy. Build from firmware/ only.
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[unstable]
build-std = ["core", "alloc"]

[env]
# Pin the optional memory experiment's allocator, not a device-app choice.
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = { value = "LLFF", force = true }
