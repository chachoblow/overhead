[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[unstable]
build-std = ["core", "alloc"]

[env]
# Pin the optional memory experiment's allocator, not a device-app choice.
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = { value = "LLFF", force = true }
